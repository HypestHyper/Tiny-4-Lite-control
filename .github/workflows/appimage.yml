# Builds the self-contained x86_64 AppImage for Tiny 2 Lite Control.
name: Build AppImage

on:
  push:
    branches: [main, test-app-v0.1, claude/upbeat-rubin-gnae3f]
    tags: ["v*"]
    paths:
      - "app/**"
      - ".github/workflows/appimage.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (for example v1.0.0), created on the commit being built. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libv4l-dev v4l-utils file wget patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build application
        working-directory: app
        run: cargo build --release
      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/icons/hicolor/symbolic/apps
          install -Dm755 app/target/release/tiny4lite-control AppDir/usr/bin/tiny4lite-control
          install -Dm755 "$(command -v v4l2-ctl)" AppDir/usr/bin/v4l2-ctl
          install -Dm644 app/assets/tiny4lite-control.desktop AppDir/usr/share/applications/tiny4lite-control.desktop
          install -Dm644 app/assets/tiny4lite-control.svg AppDir/usr/share/icons/hicolor/scalable/apps/tiny4lite-control.svg
          install -Dm644 app/assets/tiny4lite-control-symbolic.svg AppDir/usr/share/icons/hicolor/symbolic/apps/tiny4lite-control-symbolic.svg
      - name: Download linuxdeploy
        run: |
          curl -fL --retry 3 --retry-all-errors \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o linuxdeploy
          chmod +x linuxdeploy
          file linuxdeploy
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          OUTPUT: Tiny4LiteControl-x86_64.AppImage
        run: |
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/tiny4lite-control \
            --desktop-file AppDir/usr/share/applications/tiny4lite-control.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/tiny4lite-control.svg \
            --output appimage
          test -s "$OUTPUT"
          chmod +x "$OUTPUT"
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiny4LiteControl-x86_64
          path: Tiny4LiteControl-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        # A pushed tag such as v1.0.0, or a manual run with a release tag, publishes a GitHub release with the
        # AppImage (a manual run creates the tag on the commit it built). Its notes are docs/release-notes/<tag>.md,
        # or else that version's section of app/CHANGELOG.md.
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          if [ -s "docs/release-notes/$TAG.md" ]; then cp "docs/release-notes/$TAG.md" notes.md; else
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on {print}' app/CHANGELOG.md > notes.md; fi
          test -s notes.md || echo "Tiny 2 Lite Control $version" > notes.md
          gh release create "$TAG" Tiny4LiteControl-x86_64.AppImage --title "Tiny 2 Lite Control $version" --notes-file notes.md --target "$GITHUB_SHA"
