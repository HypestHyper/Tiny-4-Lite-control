# Builds the self-contained x86_64 AppImage for Tiny 2 Lite Control.
name: Build AppImage

on:
  push:
    branches: [test-app-v0.1, claude/upbeat-rubin-gnae3f]
    paths:
      - "app/**"
      - ".github/workflows/appimage.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libv4l-dev v4l-utils file wget patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build application
        working-directory: app
        run: cargo build --release
      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/icons/hicolor/symbolic/apps
          install -Dm755 app/target/release/tiny4lite-control AppDir/usr/bin/tiny4lite-control
          install -Dm755 "$(command -v v4l2-ctl)" AppDir/usr/bin/v4l2-ctl
          install -Dm644 app/assets/tiny4lite-control.desktop AppDir/usr/share/applications/tiny4lite-control.desktop
          install -Dm644 app/assets/tiny4lite-control.svg AppDir/usr/share/icons/hicolor/scalable/apps/tiny4lite-control.svg
          install -Dm644 app/assets/tiny4lite-control-symbolic.svg AppDir/usr/share/icons/hicolor/symbolic/apps/tiny4lite-control-symbolic.svg
      - name: Download linuxdeploy
        run: |
          curl -fL --retry 3 --retry-all-errors \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o linuxdeploy
          chmod +x linuxdeploy
          file linuxdeploy
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          OUTPUT: Tiny4LiteControl-x86_64.AppImage
        run: |
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/tiny4lite-control \
            --desktop-file AppDir/usr/share/applications/tiny4lite-control.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/tiny4lite-control.svg \
            --output appimage
          test -s "$OUTPUT"
          chmod +x "$OUTPUT"
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiny4LiteControl-x86_64
          path: Tiny4LiteControl-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
